<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — départ</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Cap Web</h1>
    </header>
    <section aria-labelledby="titre-chat">
      <h2 id="titre-chat">Discussion</h2>
      <ul id="messages" aria-label="Messages" aria-live="polite"></ul>
      <form action="" id="chat-form">
        <label for="message">Votre message</label>
        <textarea name="message" id="message" rows="3" maxlength="280" required></textarea>
        <button type="submit">Envoyer.</button>
        <button type="button" id="effacer">Effacer la conversation</button>
      </form>
    </section>
    <p>Le serveur fonctionne. Aujourd’hui, nous construisons notre interface.</p>
    <p id="status" role="status"></p>
    <footer>
      <span id="version"></span>
    </footer>
  </main>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
